name: After each Vercel deploy (migrate + create/sync Vaani agent)
on:
  deployment_status: {}
  workflow_dispatch: {}
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: Create or update the Vaani agent and set the Telegram webhook
        run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/admin/sync-agent" | tee sync.json
